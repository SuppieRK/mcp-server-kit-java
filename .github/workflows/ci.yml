name: CI

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Node for MCP conformance
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conformance/package-lock.json

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run the complete gate
        run: ./gradlew clean build

      - name: Run SonarQube Cloud analysis and wait for the gate
        id: sonar
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture failed main-branch quality gate details
        if: always() && steps.sonar.outcome == 'failure' && github.ref == 'refs/heads/main'
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $SONAR_TOKEN" \
            'https://sonarcloud.io/api/qualitygates/project_status?projectKey=SuppieRK_mcp-server-kit-java&branch=main' \
            --output build/reports/sonar-quality-gate.json

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            build/reports/jacoco/
            */build/reports/jacoco/
            build/reports/checkstyle/
            build/reports/sonar-quality-gate.json
            */build/reports/checkstyle/
            conformance/build/reports/conformance/
            */build/reports/tests/
            */build/test-results/
            examples/*/build/reports/tests/
            examples/*/build/test-results/
          if-no-files-found: error
