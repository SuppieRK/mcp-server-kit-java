import groovy.xml.XmlSlurper

plugins {
	id 'checkstyle'
	id 'com.diffplug.spotless'
	id 'com.vanniktech.maven.publish' apply false
	id 'org.sonarqube'
}

group = providers.gradleProperty('GROUP').get()
version = providers.gradleProperty('VERSION_NAME').get()
description = providers.gradleProperty('POM_DESCRIPTION').get()

spotless {
	java {
		target 'config/architecture/*.java'
		googleJavaFormat('1.30.0').reorderImports(false)
	}
}

ext.versions = [
	archunit: '1.5.0',
	checkstyle: '14.1.0',
	equalsverifier: '4.5.1',
	jackson: '2.22.2',
	privateJackson: '3.2.2',
	jacoco: '0.8.15',
	javalin: '6.4.0',
	junit: '6.1.3',
	micronautPlatform: '5.1.2',
	networkntSchema: '3.0.7',
	quarkus: '3.39.1',
	springBoot: '4.1.0'
]

def publishedModules = [
	'mcp-core',
	'mcp-transport-stdio',
	'mcp-transport-http',
	'mcp-spring-webmvc',
	'mcp-spring-webflux',
	'mcp-javalin'
]

checkstyle {
	toolVersion = versions.checkstyle
	configFile = file('config/checkstyle/java.xml')
	ignoreFailures = false
	maxErrors = 0
	maxWarnings = 0
}

// Run the actual policy against fixtures. Only this task accepts Checkstyle violations, and its
// assertion requires exactly the manually annotated findings (including zero for valid fixtures).
def verifyCheckstyleRules = tasks.register('verifyCheckstyleRules', Checkstyle) {
	group = 'verification'
	description = 'Verifies the Checkstyle policy with positive and negative Java fixtures.'
	source fileTree('config/checkstyle/fixtures') { include '*.java' }
	classpath = files()
	ignoreFailures = true
	showViolations = false
	doLast {
		def expected = []
		source.files.each { fixture ->
			fixture.readLines('UTF-8').eachWithIndex { line, index ->
				def marker = line =~ /\/\/ expect(-next)?: ([A-Za-z, ]+)$/
				if (marker.find()) {
					def lineNumber = index + (marker.group(1) ? 2 : 1)
					marker.group(2).split(',').each { rule ->
						expected.add("${fixture.name}:${lineNumber}:${rule.trim()}Check".toString())
					}
				}
			}
		}
		def actual = []
		new XmlSlurper().parse(reports.xml.outputLocation.get().asFile).file.each { report ->
			report.error.each { violation ->
				def rule = violation.@source.text().tokenize('.').last()
				actual.add("${new File(report.@name.text()).name}:${violation.@line}:${rule}".toString())
			}
		}
		assert !expected.empty : 'Checkstyle fixtures must include negative cases'
		assert actual.sort() == expected.sort() : "Checkstyle fixture mismatch. Expected ${expected}; found ${actual}"
		logger.lifecycle("Checkstyle fixtures passed: ${source.files.size()} files, ${expected.size()} expected violations.")
	}
}

def checkstyleAllJava = tasks.register('checkstyleAllJava', Checkstyle) {
	group = 'verification'
	description = 'Checks hygiene and correctness in all handwritten Java sources.'
	dependsOn verifyCheckstyleRules
	rootProject.subprojects.each { module ->
		source fileTree(module.file('src')) {
			include '**/java/**/*.java'
		}
	}
	source fileTree('config') {
		include '**/*.java'
		exclude 'checkstyle/fixtures/**'
	}
	classpath = files()
}

def verifyPublishingConfiguration = tasks.register('verifyPublishingConfiguration') {
	group = 'verification'
	description = 'Configures Maven Central tasks across all public modules without executing them.'
	publishedModules.each { module ->
		// Realize only: this task must never become an execution dependency of this check.
		project(":${module}").tasks.named('dropMavenCentralDeployment').get()
	}
	doLast {
		logger.lifecycle('Maven Central deployment tasks configured for all public modules.')
	}
}

allprojects {
	group = rootProject.group
	version = rootProject.version
}

subprojects {
	apply plugin: 'com.diffplug.spotless'
	apply plugin: 'jacoco'

	spotless {
		java {
			target 'src/*/java/**/*.java'
			googleJavaFormat('1.30.0').reorderImports(false)
		}
		groovyGradle {
			target '*.gradle'
			greclipse('4.36')
		}
	}

	pluginManager.withPlugin('java') {
		java {
			toolchain.languageVersion = JavaLanguageVersion.of(25)
		}

		dependencies {
			testImplementation platform("com.fasterxml.jackson:jackson-bom:${rootProject.ext.versions.jackson}")
			testImplementation 'com.fasterxml.jackson.core:jackson-databind'
			testImplementation platform("org.junit:junit-bom:${rootProject.ext.versions.junit}")
			testImplementation 'org.junit.jupiter:junit-jupiter'
			testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
		}

		jacoco {
			toolVersion = rootProject.ext.versions.jacoco
		}

		tasks.withType(JavaCompile).configureEach {
			options.release = 17
			options.encoding = 'UTF-8'
		}
		tasks.withType(Test).configureEach {
			useJUnitPlatform()
		}
		tasks.withType(AbstractArchiveTask).configureEach {
			preserveFileTimestamps = false
			reproducibleFileOrder = true
		}
		tasks.named('jacocoTestReport', JacocoReport) {
			dependsOn tasks.named('test')
			reports {
				xml.required = true
				html.required = true
				csv.required = false
			}
		}
		tasks.matching { it.name == 'sonarResolver' }.configureEach {
			dependsOn tasks.named('classes')
		}
		tasks.named('check') {
			dependsOn tasks.named('spotlessCheck')
			dependsOn rootProject.tasks.named('spotlessCheck')
			dependsOn checkstyleAllJava
		}
	}
}

configure(subprojects.findAll { it.name in publishedModules }) {
	apply plugin: 'checkstyle'

	pluginManager.withPlugin('java') {
		// One public-builder contract, exercised on every published module's runtime classpath.
		sourceSets.test.java.srcDir rootProject.file('config/architecture')
		dependencies {
			testImplementation "com.tngtech.archunit:archunit:${rootProject.ext.versions.archunit}"
		}
		checkstyle {
			toolVersion = rootProject.ext.versions.checkstyle
			configFile = rootProject.file('config/checkstyle/checkstyle.xml')
			ignoreFailures = false
			maxErrors = 0
			maxWarnings = 0
		}

		tasks.withType(Checkstyle).configureEach {
			// Production-only documentation policy; checkstyleAllJava covers test hygiene too.
			enabled = name == 'checkstyleMain'
		}
		tasks.withType(Javadoc).configureEach {
			options.encoding = 'UTF-8'
			options.addBooleanOption('Werror', true)
		}
		tasks.named('check') {
			dependsOn tasks.named('javadoc')
			dependsOn verifyPublishingConfiguration
		}
	}
}

configure(subprojects.findAll { it.name in publishedModules }) {
	pluginManager.withPlugin('java') {
		tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
			dependsOn tasks.named('test')
			violationRules {
				rule {
					limit {
						counter = 'LINE'
						value = 'COVEREDRATIO'
						minimum = 0.90
					}
				}
			}
		}
		tasks.named('check') {
			dependsOn tasks.named('jacocoTestCoverageVerification')
			dependsOn tasks.named('jacocoTestReport')
		}
	}
}

configure(subprojects.findAll { !(it.name in publishedModules) }) {
	sonar {
		skipProject = true
	}
}

sonar {
	properties {
		property 'sonar.projectKey', 'SuppieRK_mcp-server-kit-java'
		property 'sonar.organization', 'suppierk'
		property 'sonar.host.url', 'https://sonarcloud.io'
		property 'sonar.gradle.skipCompile', 'true'
		property 'sonar.qualitygate.wait', 'true'
		property 'sonar.coverage.jacoco.xmlReportPaths',
				publishedModules.collect {
					"${it}/build/reports/jacoco/test/jacocoTestReport.xml"
				}.join(',')
	}
}

tasks.named('sonar') {
	dependsOn publishedModules.collect { ":${it}:jacocoTestReport" }
}
