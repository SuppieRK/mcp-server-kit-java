plugins {
	id 'com.diffplug.spotless' apply false
	id 'org.sonarqube'
}

group = providers.gradleProperty('GROUP').get()
version = providers.gradleProperty('VERSION_NAME').get()
description = providers.gradleProperty('POM_DESCRIPTION').get()

ext.versions = [
	archunit: '1.5.0',
	checkstyle: '12.3.1',
	equalsverifier: '4.5.1',
	jackson: '2.22.2',
	jacoco: '0.8.15',
	javalin: '6.4.0',
	junit: '6.1.3',
	micronautPlatform: '5.1.2',
	networkntSchema: '2.0.4',
	quarkus: '3.39.1',
	springBoot: '4.1.0'
]

def publishedModules = [
	'mcp-core',
	'mcp-transport-stdio',
	'mcp-transport-http',
	'mcp-spring-webmvc',
	'mcp-spring-webflux',
	'mcp-javalin'
]

allprojects {
	group = rootProject.group
	version = rootProject.version
}

subprojects {
	apply plugin: 'com.diffplug.spotless'
	apply plugin: 'jacoco'

	spotless {
		java {
			target 'src/*/java/**/*.java'
			googleJavaFormat('1.30.0').reorderImports(false)
		}
		groovyGradle {
			target '*.gradle'
			greclipse('4.36')
		}
	}

	pluginManager.withPlugin('java') {
		java {
			toolchain.languageVersion = JavaLanguageVersion.of(25)
		}

		dependencies {
			testImplementation platform("org.junit:junit-bom:${rootProject.ext.versions.junit}")
			testImplementation 'org.junit.jupiter:junit-jupiter'
			testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
		}

		jacoco {
			toolVersion = rootProject.ext.versions.jacoco
		}

		tasks.withType(JavaCompile).configureEach {
			options.release = 17
			options.encoding = 'UTF-8'
		}
		tasks.withType(Test).configureEach {
			useJUnitPlatform()
		}
		tasks.withType(AbstractArchiveTask).configureEach {
			preserveFileTimestamps = false
			reproducibleFileOrder = true
		}
		tasks.named('jacocoTestReport', JacocoReport) {
			dependsOn tasks.named('test')
			reports {
				xml.required = true
				html.required = true
				csv.required = false
			}
		}
		tasks.matching { it.name == 'sonarResolver' }.configureEach {
			dependsOn tasks.named('classes')
		}
		tasks.named('check') {
			dependsOn tasks.named('spotlessCheck')
		}
	}
}

configure(subprojects.findAll { it.name in publishedModules }) {
	apply plugin: 'checkstyle'

	pluginManager.withPlugin('java') {
		checkstyle {
			toolVersion = rootProject.ext.versions.checkstyle
			configFile = rootProject.file('config/checkstyle/checkstyle.xml')
		}

		tasks.withType(Checkstyle).configureEach {
			enabled = name == 'checkstyleMain'
		}
		tasks.withType(Javadoc).configureEach {
			options.encoding = 'UTF-8'
			options.addBooleanOption('Werror', true)
		}
		tasks.named('check') {
			dependsOn tasks.named('javadoc')
		}
	}
}

configure(subprojects.findAll { it.name in publishedModules }) {
	pluginManager.withPlugin('java') {
		tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
			dependsOn tasks.named('test')
			violationRules {
				rule {
					limit {
						counter = 'LINE'
						value = 'COVEREDRATIO'
						minimum = 0.90
					}
				}
			}
		}
		tasks.named('check') {
			dependsOn tasks.named('jacocoTestCoverageVerification')
			dependsOn tasks.named('jacocoTestReport')
		}
	}
}

configure(subprojects.findAll { !(it.name in publishedModules) }) {
	sonar {
		skipProject = true
	}
}

sonar {
	properties {
		property 'sonar.projectKey', 'suppierk_mcp-server-kit-java'
		property 'sonar.organization', 'suppierk'
		property 'sonar.host.url', 'https://sonarcloud.io'
		property 'sonar.gradle.skipCompile', 'true'
		property 'sonar.qualitygate.wait', 'true'
		property 'sonar.coverage.jacoco.xmlReportPaths',
				publishedModules.collect {
					"${it}/build/reports/jacoco/test/jacocoTestReport.xml"
				}.join(',')
	}
}

tasks.named('sonar') {
	dependsOn publishedModules.collect { ":${it}:jacocoTestReport" }
}
